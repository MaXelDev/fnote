[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fnote"
version = "1.2.1"
description = "Prise de notes manuscrites au stylet pour Fedora/Wayland, 100 % locale"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8",
    "PyMuPDF>=1.24",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fnote = "fnote.app:main"

[tool.setuptools.packages.find]
include = ["fnote*"]

[tool.setuptools.package-data]
fnote = ["resources/*.json", "resources/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
